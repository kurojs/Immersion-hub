spring.application.name=hub

spring.profiles.active=dev

spring.datasource.url=jdbc:postgresql://localhost:5432/immersion
spring.datasource.username=immersion
spring.datasource.password=immersion

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.web.locale=en
spring.web.locale-resolver=fixed

app.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
app.google.translate-key=${GOOGLE_TRANSLATE_KEY:your-google-translate-key}
app.jwt.secret=${JWT_SECRET:development-jwt-secret-change-me-at-least-32-characters-123456}
